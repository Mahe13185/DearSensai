<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181B26" />
      <stop offset="100%" stop-color="#0B0D13" />
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#272D3D" stroke-width="8" />

  <!-- Outer Subtle Enso Ring (Japanese Zen Recall Circle) -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#2C344E" stroke-width="12" stroke-dasharray="800" stroke-dashoffset="140" stroke-linecap="round" />
  
  <!-- Active Recall Arc -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#indigoGrad)" stroke-width="16" stroke-dasharray="600" stroke-dashoffset="320" stroke-linecap="round" filter="url(#glow)" />

  <!-- Sensai S Symbol / Torii minimalist arch -->
  <!-- Top Arch -->
  <path d="M150 176 C220 160, 292 160, 362 176" fill="none" stroke="url(#indigoGrad)" stroke-width="20" stroke-linecap="round" />
  <!-- Pillar Left -->
  <line x1="200" y1="176" x2="190" y2="340" stroke="#CBD5E1" stroke-width="16" stroke-linecap="round" />
  <!-- Pillar Right -->
  <line x1="312" y1="176" x2="322" y2="340" stroke="#CBD5E1" stroke-width="16" stroke-linecap="round" />
  <!-- Inner Cross Beam -->
  <line x1="170" y1="225" x2="342" y2="225" stroke="url(#indigoGrad)" stroke-width="14" stroke-linecap="round" />

  <!-- Focused Center Recall Orb (Red Accent Dot) -->
  <circle cx="256" cy="285" r="24" fill="url(#accentGrad)" filter="url(#glow)" />
</svg>
